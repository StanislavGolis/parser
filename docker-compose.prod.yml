# ─────────────────────────────────────────────────────────────────
#  docker-compose.prod.yml — production-стек (этап 7 ТЗ)
#
#  Один стек: postgres + redis + migrate + parser-dvach + parser-slivach + api +
#  web + nginx.
#  Используется и для локального теста «в один клик», и для деплоя на VPS.
#
#  Запуск (один клик):
#    docker compose -f docker-compose.prod.yml up -d --build
#    # сайт: http://localhost:${HTTP_PORT}  (по умолчанию 80)
#
#  Полезные команды:
#    docker compose -f docker-compose.prod.yml ps
#    docker compose -f docker-compose.prod.yml logs -f api
#    docker compose -f docker-compose.prod.yml logs -f parser-dvach
#    docker compose -f docker-compose.prod.yml logs -f parser-slivach
#    docker compose -f docker-compose.prod.yml down        # остановить
#    docker compose -f docker-compose.prod.yml down -v     # + удалить тома БД/медиа
#
#  Настройки берутся из переменных окружения (файл .env в корне
#  подхватывается автоматически). См. .env.prod.example.
# ─────────────────────────────────────────────────────────────────

name: parser-site

x-backend: &backend
  image: parser-backend:local
  environment:
    # Хост БД/Redis — внутренние имена сервисов compose (не localhost!)
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-pass}@postgres:5432/${POSTGRES_DB:-parser}
    REDIS_URL: redis://redis:6379/0

    # Объектное хранилище S3 (Timeweb Cloud)
    S3_URL: ${S3_URL:-https://s3.twcstorage.ru}
    S3_REGION: ${S3_REGION:-ru-1}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
    S3_SIGNED_URL_TTL: ${S3_SIGNED_URL_TTL:-3600}

    # Пул соединений к БД. Дефолтных 5+10 не хватало: под нагрузкой (скан
    # каталогов + прогрев кэша + SSR) API отдавал 500 «QueuePool limit …
    # connection timed out», а страницы висели.
    DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15}
    DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}

    # Перекодирование видео в 720p. По умолчанию выключено: ffmpeg на слабом VPS
    # забивает CPU/диск, а плеер играет оригинал инлайном (см. DEPLOY.md про /raw).
    # Включается одной переменной: PARSER_VIDEO_WEB_ENABLED=1 в .env.
    VIDEO_WEB_ENABLED: ${PARSER_VIDEO_WEB_ENABLED:-0}

    # Режим сайта (модель Dredger 2.0): `closed` — закрытая платформа (контент
    # только по сессии, индексация запрещена), `public` — прежнее поведение.
    SITE_MODE: ${SITE_MODE:-public}

    # Telegram (модель Dredger 2.0): бот продаёт и выдаёт доступ, сайт показывает.
    # Токен нужен ручке выдачи magic link, ник — кнопке входа на странице /login.
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
    # Кому уходит карантин автопоста (личка бота). Владелец узнаёт свой id
    # командой /id в боте. Без него карантин доставляется только админам,
    # которые входили на сайт через Telegram.
    TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
    MAGIC_LINK_TTL_MINUTES: ${MAGIC_LINK_TTL_MINUTES:-10}
    # Сколько секунд уже использованная ссылка ещё считается входом (мессенджер
    # открывает её сам, человек — вторым переходом). 0 — строгая одноразовость.
    MAGIC_LINK_REUSE_SECONDS: ${MAGIC_LINK_REUSE_SECONDS:-90}

    # Крипта: Crypto Pay (CryptoBot). Токен приложения — @CryptoBot → /pay → Create App.
    # Суммы берутся из тарифов (plans.price_usdt_cents), правятся в админке.
    CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
    CRYPTOBOT_TESTNET: ${CRYPTOBOT_TESTNET:-false}
    CRYPTOBOT_ASSET: ${CRYPTOBOT_ASSET:-USDT}
    CRYPTOBOT_INVOICE_TTL_MINUTES: ${CRYPTOBOT_INVOICE_TTL_MINUTES:-60}
    MEDIA_DELIVERY: ${MEDIA_DELIVERY:-proxy}

    # API (общие настройки нужны и парсеру тоже)
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    API_RATE_LIMIT: ${API_RATE_LIMIT:-900}
    # Медиа-файлы: превью — в отдельной «щедрой» корзине (лента запрашивает десятки
    # картинок на экран), «тяжёлые» варианты и оригиналы — под строгим лимитом
    MEDIA_RATE_LIMIT: ${MEDIA_RATE_LIMIT:-3000}
    MEDIA_PREVIEW_RATE_LIMIT: ${MEDIA_PREVIEW_RATE_LIMIT:-12000}
    # Посещения и события интерфейса (своя аналитика) — своя корзина
    EVENTS_RATE_LIMIT: ${EVENTS_RATE_LIMIT:-900}
    API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost}
    POPULARITY_RECALC_MINUTES: ${POPULARITY_RECALC_MINUTES:-5}

    # Подписанные ссылки на премиум-превью (см. src/services/asset_sign.py).
    # Пусто — выключено (превью идут только по сессии, `private, no-store`). С секретом
    # ссылка подписана, поэтому её отдаёт и кэширует nginx: 65 → 1000+ превью/с.
    ASSET_LINK_SECRET: ${ASSET_LINK_SECRET:-}
    ASSET_LINK_TTL_MINUTES: ${ASSET_LINK_TTL_MINUTES:-60}
    # Кэш проверок доступа к файлу и JSON-ленты: убирает лишние SQL при листании
    MEDIA_ACCESS_CACHE_SECONDS: ${MEDIA_ACCESS_CACHE_SECONDS:-120}
    FEED_CACHE_SECONDS: ${FEED_CACHE_SECONDS:-45}
    # Диагностика/безопасность
    SQL_ECHO: ${SQL_ECHO:-0}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    # Вход в админку по email+паролю и восстановление пароля по почте
    ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ADMIN_RESET_TTL_MINUTES: ${ADMIN_RESET_TTL_MINUTES:-30}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    # Публичный адрес сайта и ключ IndexNow — уведомления о новых страницах
    SITE_URL: ${SITE_URL:-https://media-archive.example}
    INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_TLS: ${SMTP_TLS:-ssl}
    # Локальный кэш медиа (диск): S3 ~3 МБ/с против 500+ МБ/с у диска
    MEDIA_CACHE_ENABLED: ${MEDIA_CACHE_ENABLED:-1}
    MEDIA_CACHE_DIR: /data/cache
    MEDIA_CACHE_MAX_BYTES: ${MEDIA_CACHE_MAX_BYTES:-42949672960}
    MEDIA_CACHE_MIN_FREE_BYTES: ${MEDIA_CACHE_MIN_FREE_BYTES:-10737418240}
    MEDIA_CACHE_WARM_WORKERS: ${MEDIA_CACHE_WARM_WORKERS:-4}
    STORAGE_PATH: /data/media
  restart: unless-stopped
  # Ограничение логов docker: иначе json-file растёт без предела (парсер болтлив)
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - site

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parser}
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parser-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parser} -d ${POSTGRES_DB:-parser}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - site

  # ── Redis (кэш, rate limiting, счётчики) ──────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - site

  # ── Миграции схемы БД (разовый запуск) ────────────────────
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── API сайта (FastAPI) ────────────────────────────────────
  api:
    <<: *backend
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # Локальный кэш медиа: отдаём файлы с диска вместо повторных запросов в S3
      - mediacache:/data/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Парсеры: контейнер на источник ─────────────────────────────────
  # Один образ, разные процессы: каждый обслуживает СВОЙ источник
  # (`PARSER_SOURCE`), поэтому у них независимые рестарты, логи, лимиты и флаги
  # прогона (`parser:{code}:enabled` — своя кнопка в админке). Очередь живёт в БД,
  # прогресс/живость — в Redis под ключами источника (`parser:{code}:*`), так что
  # контейнеры друг другу не мешают. Сверку данных (reconciliation) выполняет
  # ровно один контейнер: у остальных `RECONCILE_MINUTES=-1`.
  #
  # ВНИМАНИЕ: YAML-мердж `<<: *backend` поверхностный — как только у сервиса
  # появляется свой `environment`, карта окружения из анкора НЕ подмешивается.
  # Поэтому общие переменные (DB/Redis/S3/кэш) перечислены здесь явно.
  parser-dvach:
    <<: *backend
    command: ["python", "src/main.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-pass}@postgres:5432/${POSTGRES_DB:-parser}
      # Транскодирование видео выключено: на этом VPS ffmpeg забивает диск и CPU
      # (именно это уронило сервер). Включается одной переменной:
      # PARSER_VIDEO_WEB_ENABLED=1 в .env. Постеры (thumb) генерируются всегда.
      VIDEO_WEB_ENABLED: ${PARSER_VIDEO_WEB_ENABLED:-0}
      # Пул соединений к БД (значения по умолчанию — в src/core/config.py)
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: redis://redis:6379/0
      S3_URL: ${S3_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      MEDIA_DELIVERY: ${MEDIA_DELIVERY:-proxy}
      STORAGE_PATH: /data/media
      MEDIA_CACHE_ENABLED: ${MEDIA_CACHE_ENABLED:-1}
      MEDIA_CACHE_DIR: /data/cache
      MEDIA_CACHE_MAX_BYTES: ${MEDIA_CACHE_MAX_BYTES:-42949672960}
      MEDIA_CACHE_MIN_FREE_BYTES: ${MEDIA_CACHE_MIN_FREE_BYTES:-10737418240}
      # Источник и его расписание/вежливость
      PARSER_SOURCE: dvach
      BOARDS_TO_PARSE: ${BOARDS_TO_PARSE:-["b"]}
      REQUEST_DELAY: ${REQUEST_DELAY:-0.5}
      PARSE_INTERVAL: ${PARSE_INTERVAL:-60}
      MAX_FILES_PER_POST: ${MAX_FILES_PER_POST:-5}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
      MAX_PARALLEL_DOWNLOADS: ${MAX_PARALLEL_DOWNLOADS:-2}
      MAX_PARALLEL_UPLOADS: ${MAX_PARALLEL_UPLOADS:-1}
      RECONCILE_MINUTES: ${RECONCILE_MINUTES:-60}
    volumes:
      - media:/data/media
      # Тот же кэш, что у API: парсер кладёт оригиналы и деривативы без доп. трафика
      - mediacache:/data/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Лимиты процесса (docker compose v2 применяет их и без swarm): 2ch — основной
    # объём загрузок, но контейнер не должен «съедать» VPS при всплеске
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  parser-slivach:
    <<: *backend
    command: ["python", "src/main.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-pass}@postgres:5432/${POSTGRES_DB:-parser}
      # Транскодирование видео выключено: ffmpeg на этом VPS забивает диск
      # (именно это уронило сервер). Включается: PARSER_VIDEO_WEB_ENABLED=1
      VIDEO_WEB_ENABLED: ${PARSER_VIDEO_WEB_ENABLED:-0}
      # Пул соединений к БД (значения по умолчанию — в src/core/config.py)
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: redis://redis:6379/0
      S3_URL: ${S3_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      MEDIA_DELIVERY: ${MEDIA_DELIVERY:-proxy}
      STORAGE_PATH: /data/media
      MEDIA_CACHE_ENABLED: ${MEDIA_CACHE_ENABLED:-1}
      MEDIA_CACHE_DIR: /data/cache
      MEDIA_CACHE_MAX_BYTES: ${MEDIA_CACHE_MAX_BYTES:-42949672960}
      MEDIA_CACHE_MIN_FREE_BYTES: ${MEDIA_CACHE_MIN_FREE_BYTES:-10737418240}
      # Источник и его расписание/вежливость
      PARSER_SOURCE: slivach
      # Сайт трогаем вежливее: медленнее запросы, без параллельных загрузок
      REQUEST_DELAY: ${SLIVACH_REQUEST_DELAY:-1.0}
      PARSE_INTERVAL: ${SLIVACH_PARSE_INTERVAL:-300}
      MAX_PARALLEL_DOWNLOADS: ${SLIVACH_MAX_PARALLEL_DOWNLOADS:-1}
      MAX_PARALLEL_UPLOADS: 1
      # Сверку данных ведёт только 2ch-контейнер
      RECONCILE_MINUTES: -1
    volumes:
      - media:/data/media
      - mediacache:/data/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # ── Архивный источник: разделы, восстановленные из Wayback Machine ──
  # Каталог и файлы берутся из веб-архива (src/parsers/wayback.py). Прогон нужен,
  # чтобы докачивать включённые в админке треды архива; архив не меняется, поэтому
  # расписание редкое, а запросы медленные (сервис лимитирует частоту).
  parser-wayback:
    <<: *backend
    command: ["python", "src/main.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-pass}@postgres:5432/${POSTGRES_DB:-parser}
      REDIS_URL: redis://redis:6379/0
      S3_URL: ${S3_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      MEDIA_DELIVERY: ${MEDIA_DELIVERY:-proxy}
      STORAGE_PATH: /data/media
      MEDIA_CACHE_ENABLED: ${MEDIA_CACHE_ENABLED:-1}
      MEDIA_CACHE_DIR: /data/cache
      MEDIA_CACHE_MAX_BYTES: ${MEDIA_CACHE_MAX_BYTES:-42949672960}
      MEDIA_CACHE_MIN_FREE_BYTES: ${MEDIA_CACHE_MIN_FREE_BYTES:-10737418240}
      PARSER_SOURCE: wayback
      # Архив отвечает медленно и режет частые запросы: паузы и по одной загрузке
      REQUEST_DELAY: ${WAYBACK_REQUEST_DELAY:-1.5}
      PARSE_INTERVAL: ${WAYBACK_PARSE_INTERVAL:-3600}
      MAX_PARALLEL_DOWNLOADS: ${WAYBACK_MAX_PARALLEL_DOWNLOADS:-1}
      MAX_PARALLEL_UPLOADS: 1
      # Видео из архива не перекодируем: длинные webm занимают десятки минут
      VIDEO_WEB_ENABLED: ${WAYBACK_VIDEO_WEB_ENABLED:-0}
      # Сверку данных ведёт только 2ch-контейнер
      RECONCILE_MINUTES: -1
    volumes:
      - media:/data/media
      - mediacache:/data/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # ── 4chan: официальный JSON API (каталог, треды, медиа i.4cdn.org) ──
  # Треды на 4chan живут недолго (свой архив — несколько суток), поэтому прогон
  # частый: что успели скачать — остаётся у нас, ушедшее в архив добирается
  # отдельным инструментом (`src/tools/chan4_import.py`).
  parser-chan4:
    <<: *backend
    command: ["python", "src/main.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-pass}@postgres:5432/${POSTGRES_DB:-parser}
      # Транскодирование видео выключено: на этом VPS ffmpeg забивает диск и CPU
      VIDEO_WEB_ENABLED: ${PARSER_VIDEO_WEB_ENABLED:-0}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: redis://redis:6379/0
      S3_URL: ${S3_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      MEDIA_DELIVERY: ${MEDIA_DELIVERY:-proxy}
      STORAGE_PATH: /data/media
      MEDIA_CACHE_ENABLED: ${MEDIA_CACHE_ENABLED:-1}
      MEDIA_CACHE_DIR: /data/cache
      MEDIA_CACHE_MAX_BYTES: ${MEDIA_CACHE_MAX_BYTES:-42949672960}
      MEDIA_CACHE_MIN_FREE_BYTES: ${MEDIA_CACHE_MIN_FREE_BYTES:-10737418240}
      PARSER_SOURCE: chan4
      # 4chan API просит не чаще одного запроса в секунду — держим паузу и по одной
      # загрузке на процесс, чтобы не получить бан по IP
      REQUEST_DELAY: ${CHAN4_REQUEST_DELAY:-1.0}
      PARSE_INTERVAL: ${CHAN4_PARSE_INTERVAL:-300}
      MAX_PARALLEL_DOWNLOADS: ${CHAN4_MAX_PARALLEL_DOWNLOADS:-2}
      MAX_PARALLEL_UPLOADS: 1
      # В посте 4chan максимум 4 вложения
      MAX_FILES_PER_POST: ${CHAN4_MAX_FILES_PER_POST:-4}
      MAX_FILE_SIZE: ${CHAN4_MAX_FILE_SIZE:-104857600}
      # Сверку данных ведёт только 2ch-контейнер
      RECONCILE_MINUTES: -1
    volumes:
      - media:/data/media
      - mediacache:/data/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # ── Telegram-бот (модель Dredger 2.0) ──────────────────────────
  # Витрина и вход: выдаёт одноразовые ссылки на закрытый сайт, показывает статус
  # подписки. Работает через long polling — публичный вебхук и домен не нужны, а
  # если сайт лежит, бот продолжает отвечать. Пока токен не задан, процесс ждёт.
  telegram-gateway:
    <<: *backend
    command: ["python", "-m", "src.tools.telegram_bot"]
    environment:
      # Бот общается только с нашим API по внутреннему адресу
      API_INTERNAL_URL: http://api:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
      # Крипта: бот сам зовёт Crypto Pay (счёт) и наш API (проверка оплаты)
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      CRYPTOBOT_TESTNET: ${CRYPTOBOT_TESTNET:-false}
      CRYPTOBOT_ASSET: ${CRYPTOBOT_ASSET:-USDT}
      SITE_URL: ${SITE_URL:-https://media-archive.example}
      SITE_MODE: ${SITE_MODE:-public}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # ── Публикация в канал: расписание, автопост, итоги розыгрышей ──────
  # Отдельный процесс (по образцу `telegram-gateway`): раз в минуту публикует
  # отложенные посты (`status=scheduled`), собирает дайджест в карантин (отправляет
  # его в ЛС админам бота) и подводит итоги розыгрышей. Без него `scheduled_at`
  # и автопостинг просто ждут своего часа.
  telegram-publisher:
    <<: *backend
    command: ["python", "-m", "src.tools.telegram_autopost"]
    environment:
      # Свой environment перекрывает карту из анкора — перечисляем явно
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-pass}@postgres:5432/${POSTGRES_DB:-parser}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      REDIS_URL: redis://redis:6379/0
      S3_URL: ${S3_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      SITE_URL: ${SITE_URL:-https://media-archive.example}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # ── Frontend (Next.js standalone) ──────────────────────────
  web:
    image: parser-web:local
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Режим сайта нужен на этапе сборки: middleware запекает env
        SITE_MODE: ${SITE_MODE:-public}
        # Ник бота для кнопки «Войти через Telegram» (NEXT_PUBLIC_* инлайнится в бандл)
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    environment:
      # SSR внутри сети compose ходит на API по внутреннему имени
      API_BASE_SERVER: http://api:8000
      # Публичный адрес сайта: canonical, sitemap.xml, robots.txt, Open Graph.
      SITE_URL: ${SITE_URL:-https://media-archive.example}
      # Коды подтверждения панелей вебмастера (meta-тег в HTML); можно оставить пустыми
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      # Ключ IndexNow отдаётся по /indexnow-key.txt: поисковик проверяет владение сайтом
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      # Режим сайта (Dredger 2.0): `closed` — сайт за логином и без индексации
      SITE_MODE: ${SITE_MODE:-public}
      # Ник бота: кнопка «Войти через Telegram» на /login
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # NEXT_PUBLIC_API_BASE не задаём: браузер ходит на тот же origin
      # (/api проксируется nginx на сервис api).
    healthcheck:
      # Проверяем статику, которая в проекте точно есть (`web/public/logo.png`).
      # Прежний путь `/favicon.svg` файла не имел — healthcheck всегда отвечал 404, и
      # контейнер висел в статусе unhealthy, из-за чего `docker compose up -d` для
      # всего стека мог останавливаться на «dependency web failed to start».
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/logo.png || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - site

  # ── Nginx (точка входа) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      # Только на localhost: наружу смотрит хост-nginx (80/443 + TLS).
      # Docker пробрасывает порты через свой iptables в обход ufw, поэтому
      # публикация на 0.0.0.0 сделала бы сайт доступным и по HTTP в обход HTTPS.
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx/media
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - site

volumes:
  pgdata:
  media:
  mediacache:
  nginx_cache:

networks:
  site:
