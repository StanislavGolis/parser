# ─────────────────────────────────────────────────────────────────
#  docker-compose.prod.yml — production-стек (этап 7 ТЗ)
#
#  Один стек: postgres + redis + migrate + parser-dvach + parser-slivach + api +
#  web + nginx.
#  Используется и для локального теста «в один клик», и для деплоя на VPS.
#
#  Запуск (один клик):
#    docker compose -f docker-compose.prod.yml up -d --build
#    # сайт: http://localhost:${HTTP_PORT}  (по умолчанию 80)
#
#  Полезные команды:
#    docker compose -f docker-compose.prod.yml ps
#    docker compose -f docker-compose.prod.yml logs -f api
#    docker compose -f docker-compose.prod.yml logs -f parser-dvach
#    docker compose -f docker-compose.prod.yml logs -f parser-slivach
#    docker compose -f docker-compose.prod.yml down        # остановить
#    docker compose -f docker-compose.prod.yml down -v     # + удалить тома БД/медиа
#
#  Настройки берутся из переменных окружения (файл .env в корне
#  подхватывается автоматически). См. .env.prod.example.
# ─────────────────────────────────────────────────────────────────

name: parser-site

x-backend: &backend
  image: parser-backend:local
  environment:
    # Хост БД/Redis — внутренние имена сервисов compose (не localhost!)
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-pass}@postgres:5432/${POSTGRES_DB:-parser}
    REDIS_URL: redis://redis:6379/0

    # Объектное хранилище S3 (Timeweb Cloud)
    S3_URL: ${S3_URL:-https://s3.twcstorage.ru}
    S3_REGION: ${S3_REGION:-ru-1}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
    S3_SIGNED_URL_TTL: ${S3_SIGNED_URL_TTL:-3600}
    MEDIA_DELIVERY: ${MEDIA_DELIVERY:-proxy}

    # API (общие настройки нужны и парсеру тоже)
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
    # Отдельный (более высокий) лимит на медиа-файлы: галерея запрашивает десятки превью
    MEDIA_RATE_LIMIT: ${MEDIA_RATE_LIMIT:-1500}
    API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost}
    POPULARITY_RECALC_MINUTES: ${POPULARITY_RECALC_MINUTES:-5}
    # Диагностика/безопасность
    SQL_ECHO: ${SQL_ECHO:-0}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    # Вход в админку по email+паролю и восстановление пароля по почте
    ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ADMIN_RESET_TTL_MINUTES: ${ADMIN_RESET_TTL_MINUTES:-30}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_TLS: ${SMTP_TLS:-ssl}
    # Локальный кэш медиа (диск): S3 ~3 МБ/с против 500+ МБ/с у диска
    MEDIA_CACHE_ENABLED: ${MEDIA_CACHE_ENABLED:-1}
    MEDIA_CACHE_DIR: /data/cache
    MEDIA_CACHE_MAX_BYTES: ${MEDIA_CACHE_MAX_BYTES:-42949672960}
    MEDIA_CACHE_MIN_FREE_BYTES: ${MEDIA_CACHE_MIN_FREE_BYTES:-10737418240}
    MEDIA_CACHE_WARM_WORKERS: ${MEDIA_CACHE_WARM_WORKERS:-4}
    STORAGE_PATH: /data/media
  restart: unless-stopped
  # Ограничение логов docker: иначе json-file растёт без предела (парсер болтлив)
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - site

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parser}
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parser-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parser} -d ${POSTGRES_DB:-parser}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - site

  # ── Redis (кэш, rate limiting, счётчики) ──────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - site

  # ── Миграции схемы БД (разовый запуск) ────────────────────
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── API сайта (FastAPI) ────────────────────────────────────
  api:
    <<: *backend
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # Локальный кэш медиа: отдаём файлы с диска вместо повторных запросов в S3
      - mediacache:/data/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Парсеры: контейнер на источник ─────────────────────────────────
  # Один образ, разные процессы: каждый обслуживает СВОЙ источник
  # (`PARSER_SOURCE`), поэтому у них независимые рестарты, логи, лимиты и флаги
  # прогона (`parser:{code}:enabled` — своя кнопка в админке). Очередь живёт в БД,
  # прогресс/живость — в Redis под ключами источника (`parser:{code}:*`), так что
  # контейнеры друг другу не мешают. Сверку данных (reconciliation) выполняет
  # ровно один контейнер: у остальных `RECONCILE_MINUTES=-1`.
  parser-dvach:
    <<: *backend
    command: ["python", "src/main.py"]
    environment:
      PARSER_SOURCE: dvach
      BOARDS_TO_PARSE: ${BOARDS_TO_PARSE:-["b"]}
      REQUEST_DELAY: ${REQUEST_DELAY:-0.5}
      PARSE_INTERVAL: ${PARSE_INTERVAL:-60}
      MAX_FILES_PER_POST: ${MAX_FILES_PER_POST:-5}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
      MAX_PARALLEL_DOWNLOADS: ${MAX_PARALLEL_DOWNLOADS:-2}
      MAX_PARALLEL_UPLOADS: ${MAX_PARALLEL_UPLOADS:-1}
      RECONCILE_MINUTES: ${RECONCILE_MINUTES:-60}
    volumes:
      - media:/data/media
      # Тот же кэш, что у API: парсер кладёт оригиналы и деривативы без доп. трафика
      - mediacache:/data/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Лимиты процесса (docker compose v2 применяет их и без swarm): 2ch — основной
    # объём загрузок, но контейнер не должен «съедать» VPS при всплеске
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  parser-slivach:
    <<: *backend
    command: ["python", "src/main.py"]
    environment:
      PARSER_SOURCE: slivach
      # Сайт трогаем вежливее: медленнее запросы, без параллельных загрузок
      REQUEST_DELAY: ${SLIVACH_REQUEST_DELAY:-1.0}
      PARSE_INTERVAL: ${SLIVACH_PARSE_INTERVAL:-300}
      MAX_PARALLEL_DOWNLOADS: ${SLIVACH_MAX_PARALLEL_DOWNLOADS:-1}
      MAX_PARALLEL_UPLOADS: 1
      # Сверку данных ведёт только 2ch-контейнер
      RECONCILE_MINUTES: -1
    volumes:
      - media:/data/media
      - mediacache:/data/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # ── Frontend (Next.js standalone) ──────────────────────────
  web:
    image: parser-web:local
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      # SSR внутри сети compose ходит на API по внутреннему имени
      API_BASE_SERVER: http://api:8000
      # Публичный адрес сайта: canonical, sitemap.xml, robots.txt, Open Graph.
      SITE_URL: ${SITE_URL:-https://dredg.ru}
      # Коды подтверждения панелей вебмастера (meta-тег в HTML); можно оставить пустыми
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      # NEXT_PUBLIC_API_BASE не задаём: браузер ходит на тот же origin
      # (/api проксируется nginx на сервис api).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/favicon.svg || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - site

  # ── Nginx (точка входа) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      # Только на localhost: наружу смотрит хост-nginx (80/443 + TLS).
      # Docker пробрасывает порты через свой iptables в обход ufw, поэтому
      # публикация на 0.0.0.0 сделала бы сайт доступным и по HTTP в обход HTTPS.
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx/media
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - site

volumes:
  pgdata:
  media:
  mediacache:
  nginx_cache:

networks:
  site:
