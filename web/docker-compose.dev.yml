# ─────────────────────────────────────────────────────────────────
#  Локальная разработка фронтенда в контейнере.
#  API при этом запускается на хосте:  uvicorn src.api.main:app --reload
#  (venv из корня репозитория). Браузер обращается к localhost:8000,
#  SSR внутри контейнера — к host.docker.internal:8000.
# ─────────────────────────────────────────────────────────────────
services:
  web-dev:
    build:
      context: .
      target: dev
    container_name: parser-web-dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      API_BASE_SERVER: http://host.docker.internal:8000
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  web_node_modules:
  web_next:
