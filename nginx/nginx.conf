# ─────────────────────────────────────────────────────────────────
#  Nginx: единая точка входа.
#  - /api/*  → сервис api  (FastAPI, :8000)
#  - /       → сервис web  (Next.js standalone, :3000)
#  Браузер обращается к тому же origin, поэтому CORS не требуется,
#  а media-файлы раздаются напрямую с B2 по presigned URL.
# ─────────────────────────────────────────────────────────────────

upstream api_backend {
    server api:8000;
}

upstream web_frontend {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # API
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Healthcheck API (используется мониторингом/прокси)
    location = /healthz {
        proxy_pass http://api_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js: SSR + _next/static + public)
    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
