# ─────────────────────────────────────────────────────────────────
#  Nginx: единая точка входа.
#  - /api/*  → сервис api  (FastAPI, :8000)
#  - /       → сервис web  (Next.js standalone, :3000)
#  Браузер обращается к тому же origin, поэтому CORS не требуется,
#  а media-файлы отдаёт наш API (прокси S3 — бакет клиенту не раскрывается).
# ─────────────────────────────────────────────────────────────────

# Дисковый кэш деривативов (thumb/web). Этот файл включается внутрь http{}
# (include /etc/nginx/conf.d/*.conf), поэтому proxy_cache_path допустим здесь.
# Кэшируем ТОЛЬКО ассеты, не JSON-эндпоинты: просмотры/скачивания считаются
# на /view и /download — их кэшировать нельзя.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:100m
                 max_size=10g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Динамический резолвинг имён сервисов (Docker DNS): при пересоздании
    # контейнеров их IP меняется — proxy_pass с переменной резолвит заново.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API
    location /api/ {
        # Медиа-прокси S3: отдаём поток без буферизации на диск
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Видео (Range): кэш чанками через slice ────────────────────
    location ~ ^/api/v1/media/[0-9]+/asset/video {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        slice 1m;
        proxy_cache media_cache;
        proxy_cache_key $scheme$request_method$host$request_uri$slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_set_header Range $slice_range;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # ВАЖНО: Cache-Control НЕ игнорируем — премиум-видео отдаётся с
        # `private, no-store` и в кэш не попадает (иначе утечёт анонимам).
        proxy_ignore_headers Set-Cookie;
        proxy_buffering on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Деривативы медиа: дисковый кэш ────────────────────────────
    # Только preview/optimized (…/asset/thumb|thumb_blur|web|video).
    # Деривативы неизменяемы, URL версионируется (?v=<hash>) → длинный TTL.
    # ВАЖНО: /view, /download, /raw здесь НЕ кэшируются (статистика/оригинал).
    # Cache-Control НЕ игнорируем: премиум-контент отдаётся с `private, no-store`
    # (только подписчику) и в общий кэш не попадает; размытый thumb_blur публичен.
    location ~ ^/api/v1/media/[0-9]+/asset/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache media_cache;
        proxy_cache_key $scheme$request_method$host$request_uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_buffering on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Healthcheck API (используется мониторингом/прокси)
    location = /healthz {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js: SSR + _next/static + public)
    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
